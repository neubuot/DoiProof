name: Windows desktop verifier

# Testet und baut den Windows-Prüfer als portable EXE. Bei einem Release-Tag (v*) wird die
# EXE mit SHA-256-Summe an das GitHub-Release angehängt.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'assets/fonts/**'
      - 'scripts/verify.mjs'
      - 'scripts/fixtures/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'assets/fonts/**'
      - 'scripts/verify.mjs'
      - 'scripts/fixtures/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # Getrennte Schritte: In PowerShell bricht ein fehlschlagender Befehl mitten im Block nicht ab.
      - name: Install core dependencies
        run: npm ci
      - name: Test verification core
        run: npm test
      - name: Check TypeScript
        run: npm run check
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Test desktop integration
        working-directory: desktop
        run: npm test
      - name: Smoke test desktop window
        working-directory: desktop
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: DoiProof-Pruefer-Preview
          path: desktop/preview.png
          if-no-files-found: error
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} passt nicht zur Desktop-Version $version."
          }
      - name: Build portable Windows executable
        working-directory: desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $artifact = Get-Item "desktop/dist/DoiProof-Pruefer-${{ steps.version.outputs.version }}-Windows.exe"
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content "desktop/dist/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DoiProof-Pruefer-Windows
          path: |
            desktop/dist/DoiProof-Pruefer-${{ steps.version.outputs.version }}-Windows.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "DoiProof $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { gh release view $tag | Out-Null }
            if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht angelegt werden." }
          }
          gh release upload $tag "desktop/dist/DoiProof-Pruefer-$version-Windows.exe" "desktop/dist/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload der Release-Dateien fehlgeschlagen." }
